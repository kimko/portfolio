    <title>Woodworks - Woodworking Portfolio</title>
    <style>
      #app-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #F7F6F3;
        font-family: 'Zilla Slab', Georgia, serif;
      }
      #app-loader .loader-text {
        font-size: 20px;
        font-weight: 600;
        color: #5E564D;
        margin-bottom: 24px;
      }
      #app-loader .loader-bar {
        width: 60px;
        height: 2px;
        background: #E2DDD5;
        border-radius: 2px;
        overflow: hidden;
        position: relative;
      }
      #app-loader .loader-bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: -60px;
        width: 60px;
        height: 100%;
        background: #A0640F;
        border-radius: 2px;
        animation: loader-slide 1.2s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loader .loader-bar::after { animation: none; left: 0; }
      }
      @keyframes loader-slide {
        0% { left: -60px; }
        50% { left: 60px; }
        100% { left: -60px; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-loader">
        <div class="loader-text">Woodworks</div>
        <div class="loader-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
